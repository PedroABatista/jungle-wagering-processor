services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teste1
      POSTGRES_PASSWORD: testado123
      POSTGRES_DB: bancoTeste
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teste1 -d bancoTeste"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  postgres-data:
  localstack-data: